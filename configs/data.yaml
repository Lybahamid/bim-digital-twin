seed: 0
paths:
  ifc: data/raw/ifc/wellness_center.ifc
  bim_out: data/processed/bim
  ppe_raw: data/raw/ppe
  ppe_out: data/processed/ppe
  synthetic: data/synthetic

# Which IFC elements go into the synthetic site (~12). Ranked by size within each rule.
selection:
  - ifc_class: IfcSlab
    storeys: [Grond floor, First floor]   # spelling as in the IFC
    min_area_m2: 20
    max: 2
  - ifc_class: IfcColumn
    storeys: null                          # any storey
    max: 3
  - ifc_class: IfcWall
    storeys: [Grond floor, First floor]
    max_height_m: 5.0                      # single-storey walls only (skip stair/lift cores)
    max: 7

schedule:
  epoch_days: [10, 20, 30, 40, 50, 60]
  durations: {IfcSlab: 8, IfcColumn: 6, IfcWall: 8}   # planned days per element
  stagger_days: 2        # start offset between elements of the same group
  n_delayed: 4           # elements whose actual dates slip
  start_delay_days: [2, 5]
  extra_finish_delay_days: [3, 6]

ppe:
  test_fraction_of_valid: 0.5
